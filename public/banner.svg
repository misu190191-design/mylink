<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e0836" />
      <stop offset="40%" stop-color="#2d1052" />
      <stop offset="80%" stop-color="#15082b" />
      <stop offset="100%" stop-color="#0b0318" />
    </linearGradient>
    <radialGradient id="glow1" cx="30%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="80%" r="55%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow3" cx="60%" cy="40%" r="40%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
    </pattern>
  </defs>
  
  <rect width="1200" height="400" fill="url(#bgGrad)" />
  <rect width="1200" height="400" fill="url(#grid)" />
  <circle cx="350" cy="80" r="320" fill="url(#glow1)" />
  <circle cx="950" cy="300" r="300" fill="url(#glow2)" />
  <circle cx="700" cy="180" r="220" fill="url(#glow3)" />
  
  <!-- Subtle decorative code curves -->
  <path d="M 0 320 Q 300 260 600 340 T 1200 280" fill="none" stroke="rgba(168, 85, 247, 0.25)" stroke-width="2" />
  <path d="M 0 350 Q 400 390 800 310 T 1200 370" fill="none" stroke="rgba(59, 130, 246, 0.2)" stroke-width="1.5" />
  
  <!-- Decorative stars / sparkles -->
  <circle cx="200" cy="90" r="2" fill="#e9d5ff" opacity="0.8" />
  <circle cx="280" cy="150" r="1.5" fill="#e9d5ff" opacity="0.6" />
  <circle cx="850" cy="70" r="2.5" fill="#93c5fd" opacity="0.8" />
  <circle cx="1020" cy="120" r="1.5" fill="#fbcfe8" opacity="0.7" />
  <circle cx="520" cy="60" r="2" fill="#c084fc" opacity="0.9" />
